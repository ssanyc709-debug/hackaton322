<!doctype html>
<!-- buyer-assistant-demo -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Помощник покупателя подбирает товары по запросу, городу и бюджету.">
  <title>ИИ-помощник покупателя</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand__title">Помощник покупателя</h1>
    <p class="status" id="status" role="status" aria-live="polite">готов к работе</p>
  </header>

  <main class="layout">
    <section class="panel panel--dialogue" aria-labelledby="chat-title">
      <h2 class="panel__title" id="chat-title">Диалог</h2>

      <ol class="chat" id="chat" aria-label="История диалога" aria-live="polite" aria-relevant="additions"></ol>

      <form class="composer" id="composer">
        <label class="visually-hidden" for="input">Ваш запрос</label>
        <textarea id="input" name="input" rows="2" required
          placeholder="Напишите запрос…"></textarea>
        <div class="composer__actions">
          <button type="submit" class="button" id="send">Подобрать</button>
          <button type="button" class="button button--ghost" id="new-dialog">Новый диалог</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="answer-title">
      <h2 class="panel__title" id="answer-title">Варианты</h2>
      <div class="results">
        <div class="answer" id="answer" aria-live="polite">
          <p class="placeholder">Введите запрос, чтобы увидеть подходящие товары.</p>
        </div>
        <div class="examples" id="example-panel" aria-labelledby="examples-title" hidden>
          <h3 class="examples__title" id="examples-title">Примеры запросов</h3>
          <div class="examples__grid" id="examples"></div>
        </div>
        <p class="metrics" id="metrics" hidden></p>
      </div>
    </section>
  </main>
</body>
</html>
